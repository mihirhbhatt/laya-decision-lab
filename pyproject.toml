[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-decision-labs"
version = "0.1.0"
description = "Laya model validation and security decision labs"
requires-python = ">=3.10"
dependencies = [
    "laya>=0.3.21",
    "pytest",
    "pyyaml"
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]

[tool.setuptools.packages.find]
where = ["src"]